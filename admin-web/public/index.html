<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>퇴실 QR 관리자</title>
<style>
  :root { color-scheme: light dark; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    max-width: 480px;
    margin: 60px auto;
    padding: 0 20px;
    color: #1f2328;
    background: #fff;
  }
  @media (prefers-color-scheme: dark) {
    body { color: #e6edf3; background: #0d1117; }
    input, select { background: #161b22; color: #e6edf3; border-color: #30363d; }
    .card, details, .sched-row { background: #161b22; border-color: #30363d; }
  }
  h1 { font-size: 1.4rem; margin-bottom: 4px; }
  p.sub { color: #656d76; margin-top: 0; font-size: 0.9rem; }
  .card, details {
    border: 1px solid #d0d7de;
    border-radius: 10px;
    padding: 20px;
    margin-top: 20px;
  }
  summary { cursor: pointer; font-weight: 600; font-size: 0.95rem; }
  details[open] summary { margin-bottom: 8px; }
  label { display: block; font-size: 0.85rem; font-weight: 600; margin: 14px 0 4px; }
  input, select {
    width: 100%;
    box-sizing: border-box;
    padding: 8px 10px;
    border: 1px solid #d0d7de;
    border-radius: 6px;
    font-size: 0.95rem;
    font-family: inherit;
  }
  button {
    margin-top: 18px;
    width: 100%;
    padding: 10px;
    border: none;
    border-radius: 6px;
    background: #1f883d;
    color: white;
    font-weight: 600;
    font-size: 0.95rem;
    cursor: pointer;
  }
  button.secondary { background: #57606a; margin-top: 8px; }
  button:disabled { opacity: 0.6; cursor: not-allowed; }
  .msg { margin-top: 14px; font-size: 0.88rem; white-space: pre-wrap; }
  .msg.error { color: #cf222e; }
  .msg.ok { color: #1a7f37; }
  .hint { color: #656d76; font-size: 0.8rem; margin-top: 20px; }
  .days { display: flex; gap: 6px; }
  .days label {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    font-weight: 400;
    font-size: 0.8rem;
    margin: 0;
    border: 1px solid #d0d7de;
    border-radius: 6px;
    padding: 8px 0;
    cursor: pointer;
  }
  @media (prefers-color-scheme: dark) { .days label { border-color: #30363d; } }
  .days input { width: auto; margin: 0; }
  .btn-row { display: flex; gap: 8px; }
  .btn-row button { margin-top: 8px; }

  /* 지금 적용 중인 설정 */
  #liveCard { border-left: 4px solid #1f883d; }
  #liveCard.stale { border-left-color: #bf8700; }
  #liveCard h2 { font-size: 0.95rem; margin: 0 0 12px; display: flex; align-items: center; gap: 8px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #1f883d; flex: none; }
  #liveCard.stale .dot { background: #bf8700; }
  .live-entry {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 0; border-top: 1px solid #d0d7de;
  }
  .live-entry:first-child { border-top: none; }
  @media (prefers-color-scheme: dark) { .live-entry { border-color: #30363d; } }
  .live-entry img { width: 44px; height: 44px; object-fit: contain; background: #fff; border-radius: 6px; flex: none; }
  .live-entry .t { font-weight: 700; font-size: 1rem; }
  .live-entry .l { color: #656d76; font-size: 0.78rem; word-break: break-all; }
  .live-meta { font-size: 0.85rem; color: #656d76; margin-top: 10px; }
  #liveNote { font-size: 0.85rem; color: #bf8700; margin: 10px 0 0; display: none; }
  #liveCard.stale #liveNote { display: block; }

  /* 일정 편집 행 */
  .sched-row {
    border: 1px solid #d0d7de; border-radius: 8px;
    padding: 12px; margin-top: 10px;
  }
  .sched-head { display: flex; gap: 8px; align-items: center; }
  .sched-head input { flex: 1; font-weight: 700; }
  .sched-head button { width: auto; margin: 0; padding: 8px 12px; flex: none; background: #57606a; }
  .sched-row label { margin: 10px 0 4px; font-size: 0.78rem; font-weight: 500; color: #656d76; }
  .sched-row img { max-width: 110px; margin-top: 8px; border: 1px solid #d0d7de; border-radius: 6px; display: none; }
</style>
</head>
<body>
  <h1>퇴실 QR 관리자</h1>
  <p class="sub">시각마다 QR과 링크를 따로 등록할 수 있습니다.</p>

  <div class="card" id="liveCard">
    <h2><span class="dot"></span>지금 적용 중인 설정</h2>
    <div id="liveEntries">불러오는 중...</div>
    <div class="live-meta" id="liveDays">-</div>
    <p id="liveNote">아래 입력한 내용이 지금 적용 중인 값과 다릅니다. 저장해야 반영됩니다.</p>
  </div>

  <div class="card">
    <label for="password">관리자 비밀번호</label>
    <input id="password" type="password" autocomplete="current-password" />

    <label>퇴실 일정</label>
    <div id="scheduleList"></div>
    <button id="addRowBtn" class="secondary" type="button">+ 시각 추가</button>

    <label>실행 요일</label>
    <div class="days">
      <label><input type="checkbox" value="mon" checked />월</label>
      <label><input type="checkbox" value="tue" checked />화</label>
      <label><input type="checkbox" value="wed" checked />수</label>
      <label><input type="checkbox" value="thu" checked />목</label>
      <label><input type="checkbox" value="fri" checked />금</label>
      <label><input type="checkbox" value="sat" />토</label>
      <label><input type="checkbox" value="sun" />일</label>
    </div>

    <button id="loadBtn" class="secondary" type="button">현재 값 불러오기</button>
    <button id="saveBtn" type="button">저장</button>

    <div id="msg" class="msg"></div>
  </div>

  <p class="hint">저장하면 학생 프로그램은 1분 내로 자동으로 새 설정을 받아갑니다.<br>
  시각을 여러 개 등록하면 하루에 그만큼, 각자 등록한 QR로 뜹니다.</p>

  <details id="presetsDetails">
    <summary>저장된 설정 불러오기 / 저장하기</summary>

    <label for="presetSelect">선택하면 바로 위 입력칸에 채워집니다</label>
    <select id="presetSelect"><option value="">비밀번호 입력 후 펼치면 자동으로 불러옵니다</option></select>

    <div class="btn-row">
      <button id="presetRenameBtn" class="secondary" type="button">이름 변경</button>
      <button id="presetDeleteBtn" class="secondary" type="button">삭제</button>
    </div>

    <label for="presetName">현재 값을 새 이름으로 저장</label>
    <input id="presetName" type="text" placeholder="예: 설정1" />
    <button id="presetSaveBtn" class="secondary" type="button">저장</button>

    <div id="presetMsg" class="msg"></div>
  </details>

  <details id="pwDetails">
    <summary>비밀번호 변경</summary>

    <label for="currentPw">현재 비밀번호</label>
    <input id="currentPw" type="password" autocomplete="current-password" />

    <label for="newPw">새 비밀번호 (6자 이상)</label>
    <input id="newPw" type="password" autocomplete="new-password" />

    <label for="newPw2">새 비밀번호 확인</label>
    <input id="newPw2" type="password" autocomplete="new-password" />

    <button id="changePwBtn" class="secondary" type="button">변경</button>

    <div id="pwMsg" class="msg"></div>
  </details>

<script>
  const msgEl = document.getElementById("msg");
  const passwordEl = document.getElementById("password");
  const dayEls = Array.from(document.querySelectorAll(".days input"));
  const loadBtn = document.getElementById("loadBtn");
  const saveBtn = document.getElementById("saveBtn");
  const listEl = document.getElementById("scheduleList");
  const addRowBtn = document.getElementById("addRowBtn");

  const DEFAULT_DAYS = ["mon", "tue", "wed", "thu", "fri"];
  const DAY_LABEL = { mon: "월", tue: "화", wed: "수", thu: "목", fri: "금", sat: "토", sun: "일" };
  const TIME_RE = /^([01]\d|2[0-3]):[0-5]\d$/;

  function setActiveDays(days) {
    const set = new Set(days && days.length ? days : DEFAULT_DAYS);
    dayEls.forEach((el) => { el.checked = set.has(el.value); });
  }

  function getActiveDays() {
    return dayEls.filter((el) => el.checked).map((el) => el.value);
  }

  function showMsg(text, type) {
    msgEl.textContent = text;
    msgEl.className = "msg" + (type ? " " + type : "");
  }

  function readFileAsDataUrl(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = () => reject(reader.error);
      reader.readAsDataURL(file);
    });
  }

  // ---- 일정 행 ----
  function addRow(entry) {
    const data = entry || {};
    const row = document.createElement("div");
    row.className = "sched-row";
    row.innerHTML =
      '<div class="sched-head">' +
      '<input class="sched-time" type="text" placeholder="18:00" />' +
      '<button class="sched-del" type="button">삭제</button>' +
      '</div>' +
      '<label>이 시각에 띄울 QR 이미지</label>' +
      '<input class="sched-file" type="file" accept="image/*" />' +
      '<img class="sched-thumb" alt="QR 미리보기" />' +
      '<label>클릭해서 닫을 때 열릴 링크 (선택)</label>' +
      '<input class="sched-link" type="text" placeholder="https://..." />';

    const timeEl = row.querySelector(".sched-time");
    const fileEl = row.querySelector(".sched-file");
    const thumbEl = row.querySelector(".sched-thumb");
    const linkEl = row.querySelector(".sched-link");

    timeEl.value = data.time || "";
    linkEl.value = data.after_close_url || "";
    // 이미지는 행 객체가 들고 있는다 (파일을 다시 고르지 않아도 유지되도록)
    row.qrImage = data.qr_image || null;
    if (row.qrImage) {
      thumbEl.src = row.qrImage;
      thumbEl.style.display = "block";
    }

    fileEl.addEventListener("change", async () => {
      const file = fileEl.files[0];
      if (!file) return;
      row.qrImage = await readFileAsDataUrl(file);
      thumbEl.src = row.qrImage;
      thumbEl.style.display = "block";
      markStale();
    });
    row.querySelector(".sched-del").addEventListener("click", () => {
      row.remove();
      if (!listEl.children.length) addRow();
      markStale();
    });
    timeEl.addEventListener("input", markStale);
    linkEl.addEventListener("input", markStale);

    listEl.appendChild(row);
    return row;
  }

  function renderRows(entries) {
    listEl.innerHTML = "";
    const list = entries && entries.length ? entries : [{}];
    list.forEach(addRow);
  }

  function collectSchedule() {
    return Array.from(listEl.children).map((row) => ({
      time: row.querySelector(".sched-time").value.trim(),
      qr_image: row.qrImage || "",
      after_close_url: row.querySelector(".sched-link").value.trim(),
    }));
  }

  // 응답을 일정 배열로 통일한다 (구 형식도 받아들임)
  function toEntries(data) {
    if (Array.isArray(data.schedule) && data.schedule.length) return data.schedule;
    const times = (data.checkout_times || [data.checkout_time]).filter(Boolean);
    return times.map((t) => ({
      time: t,
      qr_image: data.qr_image || "",
      after_close_url: data.after_close_url || "",
    }));
  }

  // ---- 지금 적용 중인 설정 ----
  let liveConfig = null;

  function renderLive(data) {
    liveConfig = data;
    const entries = toEntries(data);
    const box = document.getElementById("liveEntries");
    if (!entries.length) {
      box.textContent = "등록된 일정이 없습니다.";
    } else {
      box.innerHTML = "";
      entries.forEach((e) => {
        const div = document.createElement("div");
        div.className = "live-entry";
        if (e.qr_image) {
          const img = document.createElement("img");
          img.src = e.qr_image;
          img.alt = "QR";
          div.appendChild(img);
        }
        const text = document.createElement("div");
        const t = document.createElement("div");
        t.className = "t";
        t.textContent = e.time;
        const l = document.createElement("div");
        l.className = "l";
        l.textContent = e.after_close_url || "링크 없음";
        text.appendChild(t);
        text.appendChild(l);
        div.appendChild(text);
        box.appendChild(div);
      });
    }
    const days = data.active_days || [];
    document.getElementById("liveDays").textContent =
      "실행 요일: " + (days.length ? days.map((d) => DAY_LABEL[d] || d).join(" ") : "-");
    markStale();
  }

  function signature(entries, days) {
    return JSON.stringify([
      entries.map((e) => [e.time, (e.qr_image || "").slice(0, 64), e.after_close_url || ""]),
      days,
    ]);
  }

  function markStale() {
    if (!liveConfig) return;
    const form = collectSchedule().filter((e) => e.time || e.qr_image);
    const differs =
      form.length > 0 &&
      signature(form, getActiveDays()) !==
        signature(toEntries(liveConfig), liveConfig.active_days || []);
    document.getElementById("liveCard").classList.toggle("stale", differs);
  }

  async function refreshLive() {
    try {
      const r = await fetch("/api/current?t=" + Date.now());
      const data = await r.json();
      if (!r.ok) throw new Error(data.error || "불러오기 실패");
      renderLive(data);
    } catch (e) {
      document.getElementById("liveEntries").textContent = "불러오지 못했습니다: " + e.message;
    }
  }

  dayEls.forEach((el) => el.addEventListener("change", markStale));
  addRowBtn.addEventListener("click", () => { addRow(); markStale(); });

  renderRows([]);
  refreshLive();

  loadBtn.addEventListener("click", async () => {
    loadBtn.disabled = true;
    showMsg("불러오는 중...");
    try {
      const r = await fetch("/api/current?t=" + Date.now());
      const data = await r.json();
      if (!r.ok) throw new Error(data.error || "불러오기 실패");
      renderRows(toEntries(data));
      setActiveDays(data.active_days);
      renderLive(data);
      showMsg("현재 값을 불러왔습니다.", "ok");
    } catch (e) {
      showMsg("오류: " + e.message, "error");
    } finally {
      loadBtn.disabled = false;
    }
  });

  saveBtn.addEventListener("click", async () => {
    const password = passwordEl.value.trim();
    const schedule = collectSchedule();
    const active_days = getActiveDays();

    if (!password) {
      showMsg("관리자 비밀번호를 입력하세요.", "error");
      return;
    }
    if (!schedule.length) {
      showMsg("퇴실 시각을 최소 하나는 등록하세요.", "error");
      return;
    }
    for (const e of schedule) {
      if (!TIME_RE.test(e.time)) {
        showMsg('시각은 HH:MM 형식으로 입력하세요: "' + (e.time || "(비어 있음)") + '"', "error");
        return;
      }
      if (!e.qr_image) {
        showMsg(e.time + "에 띄울 QR 이미지를 선택하세요. (기존 이미지를 쓰려면 '현재 값 불러오기')", "error");
        return;
      }
      if (e.after_close_url && !/^https?:\/\//.test(e.after_close_url)) {
        showMsg(e.time + "의 링크는 http:// 또는 https://로 시작해야 합니다.", "error");
        return;
      }
    }
    const times = schedule.map((e) => e.time);
    const dupe = times.find((t, i) => times.indexOf(t) !== i);
    if (dupe) {
      showMsg("같은 시각이 두 번 등록되었습니다: " + dupe, "error");
      return;
    }
    if (active_days.length === 0) {
      showMsg("실행 요일을 최소 하나는 선택하세요.", "error");
      return;
    }

    saveBtn.disabled = true;
    showMsg("저장 중...");
    try {
      const r = await fetch("/api/update", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ password, schedule, active_days }),
      });
      const data = await r.json();
      if (!r.ok) throw new Error(data.error || "저장 실패");
      showMsg("저장 완료! 학생 PC에는 곧 자동으로 반영됩니다.", "ok");
      await refreshLive();
    } catch (e) {
      showMsg("오류: " + e.message, "error");
    } finally {
      saveBtn.disabled = false;
    }
  });

  // ---- 저장된 설정 (프리셋) ----
  const presetsDetails = document.getElementById("presetsDetails");
  const presetSelectEl = document.getElementById("presetSelect");
  const presetNameEl = document.getElementById("presetName");
  const presetRenameBtn = document.getElementById("presetRenameBtn");
  const presetDeleteBtn = document.getElementById("presetDeleteBtn");
  const presetSaveBtn = document.getElementById("presetSaveBtn");
  const presetMsgEl = document.getElementById("presetMsg");

  let presetsCache = {};

  function showPresetMsg(text, type) {
    presetMsgEl.textContent = text;
    presetMsgEl.className = "msg" + (type ? " " + type : "");
  }

  function renderPresetOptions() {
    presetSelectEl.innerHTML = "";
    const ids = Object.keys(presetsCache);
    const placeholder = document.createElement("option");
    placeholder.value = "";
    placeholder.textContent = ids.length ? "선택하세요" : "(저장된 설정 없음)";
    presetSelectEl.appendChild(placeholder);
    ids.forEach((id) => {
      const opt = document.createElement("option");
      opt.value = id;
      opt.textContent = presetsCache[id].name;
      presetSelectEl.appendChild(opt);
    });
  }

  async function callPresetsApi(body) {
    const r = await fetch("/api/presets", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || "요청 실패");
    return data;
  }

  async function refreshPresets() {
    const password = passwordEl.value.trim();
    if (!password) {
      showPresetMsg("먼저 위에 관리자 비밀번호를 입력하세요.", "error");
      return;
    }
    showPresetMsg("불러오는 중...");
    try {
      const data = await callPresetsApi({ password, action: "list" });
      presetsCache = data.presets || {};
      renderPresetOptions();
      showPresetMsg("");
    } catch (e) {
      showPresetMsg("오류: " + e.message, "error");
    }
  }

  presetsDetails.addEventListener("toggle", () => {
    if (presetsDetails.open) refreshPresets();
  });

  presetSelectEl.addEventListener("change", () => {
    const id = presetSelectEl.value;
    if (!id || !presetsCache[id]) return;
    const p = presetsCache[id];
    renderRows(toEntries(p));
    setActiveDays(p.active_days);
    markStale();
    showPresetMsg('"' + p.name + '" 설정을 위 입력칸에 채웠습니다. "저장"을 눌러야 학생에게 반영됩니다.', "ok");
  });

  presetSaveBtn.addEventListener("click", async () => {
    const password = passwordEl.value.trim();
    const name = presetNameEl.value.trim();
    const schedule = collectSchedule();

    if (!password) {
      showPresetMsg("먼저 위에 관리자 비밀번호를 입력하세요.", "error");
      return;
    }
    if (!name) {
      showPresetMsg("설정 이름을 입력하세요 (예: 설정1).", "error");
      return;
    }
    if (!schedule.length || schedule.some((e) => !e.time || !e.qr_image)) {
      showPresetMsg("저장할 시각과 QR 이미지를 먼저 채워주세요.", "error");
      return;
    }

    presetSaveBtn.disabled = true;
    showPresetMsg("저장 중...");
    try {
      await callPresetsApi({
        password,
        action: "save",
        name,
        schedule,
        active_days: getActiveDays(),
      });
      presetNameEl.value = "";
      showPresetMsg('"' + name + '" 이름으로 저장했습니다.', "ok");
      await refreshPresets();
    } catch (e) {
      showPresetMsg("오류: " + e.message, "error");
    } finally {
      presetSaveBtn.disabled = false;
    }
  });

  presetRenameBtn.addEventListener("click", async () => {
    const password = passwordEl.value.trim();
    const id = presetSelectEl.value;
    if (!password) {
      showPresetMsg("먼저 위에 관리자 비밀번호를 입력하세요.", "error");
      return;
    }
    if (!id || !presetsCache[id]) {
      showPresetMsg("이름을 바꿀 설정을 선택하세요.", "error");
      return;
    }
    const newName = prompt("새 이름을 입력하세요.", presetsCache[id].name);
    if (!newName || !newName.trim()) return;

    showPresetMsg("변경 중...");
    try {
      await callPresetsApi({ password, action: "rename", id, name: newName.trim() });
      showPresetMsg("이름을 변경했습니다.", "ok");
      await refreshPresets();
    } catch (e) {
      showPresetMsg("오류: " + e.message, "error");
    }
  });

  presetDeleteBtn.addEventListener("click", async () => {
    const password = passwordEl.value.trim();
    const id = presetSelectEl.value;
    if (!password) {
      showPresetMsg("먼저 위에 관리자 비밀번호를 입력하세요.", "error");
      return;
    }
    if (!id || !presetsCache[id]) {
      showPresetMsg("삭제할 설정을 선택하세요.", "error");
      return;
    }
    if (!confirm('"' + presetsCache[id].name + '" 설정을 삭제할까요?')) return;

    showPresetMsg("삭제 중...");
    try {
      await callPresetsApi({ password, action: "delete", id });
      showPresetMsg("삭제했습니다.", "ok");
      await refreshPresets();
    } catch (e) {
      showPresetMsg("오류: " + e.message, "error");
    }
  });

  // ---- 비밀번호 변경 ----
  const currentPwEl = document.getElementById("currentPw");
  const newPwEl = document.getElementById("newPw");
  const newPw2El = document.getElementById("newPw2");
  const changePwBtn = document.getElementById("changePwBtn");
  const pwMsgEl = document.getElementById("pwMsg");

  function showPwMsg(text, type) {
    pwMsgEl.textContent = text;
    pwMsgEl.className = "msg" + (type ? " " + type : "");
  }

  changePwBtn.addEventListener("click", async () => {
    const current_password = currentPwEl.value.trim();
    const new_password = newPwEl.value.trim();
    const confirmPassword = newPw2El.value.trim();

    if (!current_password || !new_password) {
      showPwMsg("현재 비밀번호와 새 비밀번호를 입력하세요.", "error");
      return;
    }
    if (new_password.length < 6) {
      showPwMsg("새 비밀번호는 6자 이상이어야 합니다.", "error");
      return;
    }
    if (new_password !== confirmPassword) {
      showPwMsg("새 비밀번호 확인이 일치하지 않습니다.", "error");
      return;
    }

    changePwBtn.disabled = true;
    showPwMsg("변경 중...");
    try {
      const r = await fetch("/api/change-password", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ current_password, new_password }),
      });
      const data = await r.json();
      if (!r.ok) throw new Error(data.error || "변경 실패");
      showPwMsg("비밀번호가 변경되었습니다. 다음부터 새 비밀번호를 사용하세요.", "ok");
      currentPwEl.value = "";
      newPwEl.value = "";
      newPw2El.value = "";
    } catch (e) {
      showPwMsg("오류: " + e.message, "error");
    } finally {
      changePwBtn.disabled = false;
    }
  });
</script>
</body>
</html>
