name: Build Windows exe

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build student QR display exe
        run: pyinstaller --onefile --noconsole --name QRcode main.py

      - name: Build admin management exe
        run: pyinstaller --onefile --noconsole --name QRcodeAdmin admin_gui.py

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc installer.iss

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: QRcode-windows
          path: |
            dist/QRcode.exe
            dist/QRcodeAdmin.exe
            installer_output/QRcodeSetup.exe
            config.json

      - name: Publish/refresh "latest" release with fixed download links
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes || true
          git tag -f latest
          git push origin latest --force
          gh release create latest dist/QRcode.exe dist/QRcodeAdmin.exe installer_output/QRcodeSetup.exe config.json \
            --title "QRcode 최신 빌드" \
            --notes "commit ${{ github.sha }} 에서 자동 빌드됨

          - QRcodeSetup.exe: 학생용 설치 프로그램 (추천 - 자동 시작 옵션 포함)
          - QRcode.exe: 학생용 (설치 없이 바로 실행, config.json 필요)
          - QRcodeAdmin.exe: 관리자용 (QR URL·시각 등록)" \
            --latest
