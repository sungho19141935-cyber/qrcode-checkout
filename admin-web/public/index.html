<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>퇴실 QR 관리자</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f6f8fa;
    --surface: #ffffff;
    --border: #d8dee4;
    --text: #1f2328;
    --muted: #656d76;
    --accent: #1f883d;
    --accent-soft: #ddf4e4;
    --warn: #9a6700;
    --warn-soft: #fff8c5;
    --danger: #cf222e;
    --radius: 12px;
    --shadow: 0 1px 3px rgba(31, 35, 40, 0.08);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --border: #30363d;
      --text: #e6edf3;
      --muted: #8b949e;
      --accent: #238636;
      --accent-soft: #12341d;
      --warn: #d29922;
      --warn-soft: #2b2411;
      --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", sans-serif;
    margin: 0;
    padding: 0 16px 60px;
    color: var(--text);
    background: var(--bg);
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 560px; margin: 0 auto; }

  header { padding: 32px 0 8px; }
  h1 { font-size: 1.3rem; margin: 0; letter-spacing: -0.01em; }
  header p { color: var(--muted); font-size: 0.88rem; margin: 6px 0 0; }

  .panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 20px;
    margin-top: 16px;
  }
  .panel h2 {
    font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--muted); margin: 0 0 14px; font-weight: 700;
  }

  label { display: block; font-size: 0.82rem; font-weight: 600; margin-bottom: 6px; }
  input[type=text], input[type=password], input[type=time], select {
    width: 100%; padding: 10px 12px;
    border: 1px solid var(--border); border-radius: 8px;
    font-size: 0.95rem; font-family: inherit;
    background: var(--surface); color: var(--text);
  }
  input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }

  button {
    font-family: inherit; font-size: 0.9rem; font-weight: 600;
    border: 1px solid transparent; border-radius: 8px;
    padding: 10px 16px; cursor: pointer;
    background: var(--accent); color: #fff;
  }
  button.ghost { background: transparent; color: var(--text); border-color: var(--border); }
  button.ghost:hover { background: var(--bg); }
  button.link { background: none; border: none; color: var(--muted); padding: 4px 8px; font-size: 0.82rem; }
  button.link:hover { color: var(--danger); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  button.block { width: 100%; }

  /* 잠금 화면 */
  #lock { margin-top: 60px; text-align: center; }
  #lock .panel { padding: 28px 24px; }
  #lock .lockicon { font-size: 1.8rem; }
  #lock p { color: var(--muted); font-size: 0.88rem; margin: 8px 0 20px; }

  /* 일정 카드 */
  .entry {
    border: 1px solid var(--border); border-radius: var(--radius);
    padding: 14px; margin-bottom: 12px; background: var(--surface);
    display: grid; grid-template-columns: 96px 1fr; gap: 14px;
  }
  .entry.invalid { border-color: var(--danger); }
  .drop {
    width: 96px; height: 96px; border-radius: 10px;
    border: 2px dashed var(--border); background: var(--bg);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; overflow: hidden; position: relative; text-align: center;
  }
  .drop.over { border-color: var(--accent); background: var(--accent-soft); }
  .drop img { width: 100%; height: 100%; object-fit: contain; background: #fff; }
  .drop span { font-size: 0.72rem; color: var(--muted); line-height: 1.4; padding: 4px; }
  .entry-fields { min-width: 0; }
  .entry-top { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .entry-top input[type=time] {
    font-size: 1.15rem; font-weight: 700; padding: 6px 10px; width: auto; flex: 1;
  }
  .entry .hint { font-size: 0.75rem; color: var(--muted); margin: 6px 0 0; }

  #addBtn { width: 100%; border: 1px dashed var(--border); background: transparent; color: var(--muted); }
  #addBtn:hover { border-color: var(--accent); color: var(--accent); }

  /* 요일 */
  .days { display: flex; gap: 6px; }
  .days label {
    flex: 1; margin: 0; text-align: center; cursor: pointer;
    border: 1px solid var(--border); border-radius: 8px; padding: 9px 0;
    font-weight: 600; font-size: 0.85rem; color: var(--muted);
    user-select: none;
  }
  .days input { display: none; }
  .days input:checked + span { color: #fff; }
  .days label:has(input:checked) { background: var(--accent); border-color: var(--accent); color: #fff; }

  /* 저장 영역 */
  #saveArea { display: flex; align-items: center; gap: 10px; margin-top: 16px; }
  #saveArea button { flex: 0 0 auto; }
  #saveBtn { min-width: 120px; }
  #saveSummary { font-size: 0.82rem; color: var(--muted); margin-top: 12px; min-height: 1.2em; }
  .hintline { font-size: 0.78rem; color: var(--warn); margin: 12px 0 0; }
  .hintline:empty { display: none; }
  #saveSummary b { color: var(--warn); }

  /* 토스트 */
  #toast {
    position: fixed; left: 50%; transform: translateX(-50%) translateY(20px);
    bottom: 32px; background: #1f2328; color: #fff;
    padding: 11px 18px; border-radius: 999px; font-size: 0.87rem; font-weight: 600;
    opacity: 0; transition: opacity 0.2s, transform 0.2s; pointer-events: none;
    max-width: 90vw; text-align: center; z-index: 10;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  #toast.error { background: var(--danger); }

  .status {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 0.78rem; font-weight: 700; padding: 4px 10px; border-radius: 999px;
    background: var(--accent-soft); color: var(--accent);
  }
  .status.dirty { background: var(--warn-soft); color: var(--warn); }
  @media (prefers-color-scheme: dark) { .status { color: #7ee2a0; } }

  details summary { cursor: pointer; font-weight: 600; font-size: 0.88rem; color: var(--muted); }
  details[open] summary { margin-bottom: 14px; }
  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; }
  .sep { height: 1px; background: var(--border); margin: 18px 0; }
  .msg { font-size: 0.83rem; margin-top: 10px; color: var(--muted); }
  .msg.error { color: var(--danger); }
  .msg.ok { color: var(--accent); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>퇴실 QR 관리자</h1>
    <p id="subtitle">시각마다 QR과 링크를 따로 등록합니다.</p>
  </header>

  <!-- 잠금 화면 -->
  <div id="lock">
    <div class="panel">
      <div class="lockicon">🔒</div>
      <p>관리자 비밀번호를 입력하세요.</p>
      <input id="password" type="password" autocomplete="current-password" placeholder="비밀번호" />
      <div style="height:12px"></div>
      <button id="unlockBtn" class="block">잠금 해제</button>
      <div id="lockMsg" class="msg"></div>
    </div>
  </div>

  <!-- 편집 화면 -->
  <main id="editor" hidden>
    <div class="panel">
      <h2>퇴실 일정 <span id="statusBadge" class="status">적용 중</span></h2>
      <div id="entries"></div>
      <button id="addBtn">+ 시각 추가</button>

      <p id="legacyNote" class="hintline"></p>
      <div id="saveSummary"></div>
      <div id="saveArea">
        <button id="saveBtn">저장</button>
        <button class="ghost" id="resetBtn">되돌리기</button>
      </div>
    </div>

    <div class="panel">
      <h2>실행 요일</h2>
      <div class="days" id="days"></div>
    </div>

    <details class="panel" id="presetsPanel">
      <summary>저장된 설정 (프리셋)</summary>
      <select id="presetSelect"></select>
      <div class="row" style="margin-top:8px">
        <button class="ghost" id="presetRenameBtn">이름 변경</button>
        <button class="ghost" id="presetDeleteBtn">삭제</button>
      </div>
      <div class="sep"></div>
      <label for="presetName">지금 화면의 일정을 이름 붙여 저장</label>
      <div class="row">
        <input id="presetName" type="text" placeholder="예: 평일 2회" />
        <button class="ghost" id="presetSaveBtn" style="flex:0 0 auto">저장</button>
      </div>
      <div id="presetMsg" class="msg"></div>
    </details>

    <details class="panel">
      <summary>비밀번호 변경</summary>
      <label for="newPw">새 비밀번호 (6자 이상)</label>
      <input id="newPw" type="password" autocomplete="new-password" />
      <div style="height:10px"></div>
      <label for="newPw2">새 비밀번호 확인</label>
      <input id="newPw2" type="password" autocomplete="new-password" />
      <div style="height:12px"></div>
      <button class="ghost block" id="changePwBtn">변경</button>
      <div id="pwMsg" class="msg"></div>
    </details>
  </main>
</div>

<div id="toast"></div>

<script>
  const $ = (id) => document.getElementById(id);
  const DAYS = [["mon","월"],["tue","화"],["wed","수"],["thu","목"],["fri","금"],["sat","토"],["sun","일"]];
  const TIME_RE = /^([01]\d|2[0-3]):[0-5]\d$/;

  let password = "";
  let live = null;        // 서버에 저장된 현재 설정
  let presetsCache = {};

  // ---------- 공통 ----------
  function toast(text, isError) {
    const el = $("toast");
    el.textContent = text;
    el.className = "show" + (isError ? " error" : "");
    clearTimeout(el._t);
    el._t = setTimeout(() => { el.className = ""; }, 2600);
  }

  function setMsg(el, text, type) {
    el.textContent = text;
    el.className = "msg" + (type ? " " + type : "");
  }

  function readFileAsDataUrl(file) {
    return new Promise((resolve, reject) => {
      const r = new FileReader();
      r.onload = () => resolve(r.result);
      r.onerror = () => reject(r.error);
      r.readAsDataURL(file);
    });
  }

  function toEntries(data) {
    if (data && Array.isArray(data.schedule) && data.schedule.length) {
      return data.schedule.map((e) => ({
        time: e.time || "",
        qr_image: e.qr_image || "",
        after_close_url: e.after_close_url || "",
      }));
    }
    const times = ((data && data.checkout_times) || [data && data.checkout_time]).filter(Boolean);
    return times.map((t) => ({
      time: t,
      qr_image: (data && data.qr_image) || "",
      after_close_url: (data && data.after_close_url) || "",
    }));
  }

  // ---------- 요일 ----------
  function renderDays(active) {
    const set = new Set(active && active.length ? active : ["mon","tue","wed","thu","fri"]);
    $("days").innerHTML = "";
    DAYS.forEach(([value, text]) => {
      const label = document.createElement("label");
      const input = document.createElement("input");
      input.type = "checkbox";
      input.value = value;
      input.checked = set.has(value);
      input.addEventListener("change", refreshDirty);
      const span = document.createElement("span");
      span.textContent = text;
      label.appendChild(input);
      label.appendChild(span);
      $("days").appendChild(label);
    });
  }

  const getDays = () =>
    Array.from($("days").querySelectorAll("input")).filter((i) => i.checked).map((i) => i.value);

  // ---------- 일정 카드 ----------
  function addEntry(data) {
    const d = data || {};
    const el = document.createElement("div");
    el.className = "entry";
    el.innerHTML =
      '<div class="drop"><span>QR 이미지<br>클릭 · 드래그<br>또는 붙여넣기</span>' +
      '<input type="file" accept="image/*" hidden /></div>' +
      '<div class="entry-fields">' +
        '<div class="entry-top"><input type="time" /><button class="link remove">삭제</button></div>' +
        '<input type="text" class="link-input" placeholder="닫을 때 열릴 링크 (선택)" />' +
        '<p class="hint"></p>' +
      '</div>';

    const drop = el.querySelector(".drop");
    const file = el.querySelector("input[type=file]");
    const time = el.querySelector("input[type=time]");
    const link = el.querySelector(".link-input");

    el.qrImage = d.qr_image || "";
    time.value = d.time || "";
    link.value = d.after_close_url || "";

    function paint() {
      if (el.qrImage) {
        drop.innerHTML = "";
        const img = document.createElement("img");
        img.src = el.qrImage;
        drop.appendChild(img);
      }
      el.classList.toggle("invalid", !!time.value && !TIME_RE.test(time.value));
    }

    async function useFile(f) {
      if (!f || !/^image\//.test(f.type)) return;
      el.qrImage = await readFileAsDataUrl(f);
      paint();
      refreshDirty();
      toast("QR 이미지를 넣었습니다");
    }

    drop.addEventListener("click", () => file.click());
    file.addEventListener("change", () => useFile(file.files[0]));
    drop.addEventListener("dragover", (e) => { e.preventDefault(); drop.classList.add("over"); });
    drop.addEventListener("dragleave", () => drop.classList.remove("over"));
    drop.addEventListener("drop", (e) => {
      e.preventDefault();
      drop.classList.remove("over");
      useFile(e.dataTransfer.files[0]);
    });
    // 이 카드를 클릭해둔 상태에서 Ctrl+V 하면 스크린샷이 바로 들어간다
    el.addEventListener("focusin", () => { pasteTarget = el; });
    el.pasteFile = useFile;

    time.addEventListener("input", () => { paint(); refreshDirty(); });
    link.addEventListener("input", refreshDirty);
    el.querySelector(".remove").addEventListener("click", () => {
      el.remove();
      if (!$("entries").children.length) addEntry();
      refreshDirty();
    });

    paint();
    $("entries").appendChild(el);
    return el;
  }

  let pasteTarget = null;
  document.addEventListener("paste", (e) => {
    const item = Array.from(e.clipboardData.items).find((i) => i.type.startsWith("image/"));
    if (!item) return;
    const target = pasteTarget || $("entries").lastElementChild;
    if (target) target.pasteFile(item.getAsFile());
  });

  function renderEntries(list) {
    $("entries").innerHTML = "";
    (list && list.length ? list : [{}]).forEach(addEntry);
  }

  function collect() {
    return Array.from($("entries").children).map((el) => ({
      time: el.querySelector("input[type=time]").value.trim(),
      qr_image: el.qrImage || "",
      after_close_url: el.querySelector(".link-input").value.trim(),
    }));
  }

  // ---------- 변경 감지 ----------
  function sign(entries, days) {
    return JSON.stringify([
      entries.map((e) => [e.time, (e.qr_image || "").slice(0, 80), e.after_close_url]),
      days,
    ]);
  }

  function describeChanges(now, before) {
    const parts = [];
    const nowTimes = now.map((e) => e.time).filter(Boolean);
    const beforeTimes = before.map((e) => e.time).filter(Boolean);
    const added = nowTimes.filter((t) => !beforeTimes.includes(t));
    const removed = beforeTimes.filter((t) => !nowTimes.includes(t));
    if (added.length) parts.push("추가 " + added.join(", "));
    if (removed.length) parts.push("삭제 " + removed.join(", "));
    const changedImg = now.filter((e) => {
      const old = before.find((b) => b.time === e.time);
      return old && (old.qr_image || "").slice(0, 80) !== (e.qr_image || "").slice(0, 80);
    });
    if (changedImg.length) parts.push("QR 변경 " + changedImg.map((e) => e.time).join(", "));
    if (getDays().join(",") !== (live.active_days || []).join(",")) parts.push("요일 변경");
    return parts.length ? parts.join(" · ") : "수정한 내용";
  }

  function refreshDirty() {
    if (!live) return;
    const now = collect();
    const before = toEntries(live);
    const dirty = sign(now, getDays()) !== sign(before, live.active_days || []);
    $("statusBadge").className = "status" + (dirty ? " dirty" : "");
    $("statusBadge").textContent = dirty ? "저장 안 됨" : "적용 중";
    // 버튼은 항상 같은 자리에 두고, 바꾼 게 없을 때만 비활성으로 알린다
    $("saveBtn").disabled = !dirty;
    $("resetBtn").disabled = !dirty;
    $("saveSummary").innerHTML = dirty
      ? "<b>" + describeChanges(now, before) + "</b> — 저장해야 학생에게 반영됩니다"
      : "지금 적용 중인 내용과 같습니다.";
  }

  // ---------- 서버 ----------
  async function api(path, body) {
    const r = await fetch(path, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    const data = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(data.error || "요청 실패 (" + r.status + ")");
    return data;
  }

  async function loadLive() {
    const r = await fetch("/api/current?t=" + Date.now());
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || "불러오기 실패");
    live = data;
    renderEntries(toEntries(data));
    renderDays(data.active_days);
    refreshDirty();
    const times = toEntries(data).map((e) => e.time).filter(Boolean);
    $("subtitle").textContent = times.length
      ? "현재 " + times.join(", ") + " 에 표시됩니다."
      : "아직 등록된 일정이 없습니다.";
    // 여러 개 등록했을 때, 아직 재설치하지 않은 PC는 하나만 받는다는 사실을 알린다
    $("legacyNote").textContent =
      times.length > 1
        ? "아직 프로그램을 업데이트하지 않은 학생 PC에는 마지막 시각(" +
          times[times.length - 1] + ") 하나만 표시됩니다."
        : "";
  }

  // ---------- 잠금 해제 ----------
  async function unlock() {
    const pw = $("password").value.trim();
    if (!pw) { setMsg($("lockMsg"), "비밀번호를 입력하세요.", "error"); return; }
    $("unlockBtn").disabled = true;
    setMsg($("lockMsg"), "확인 중...");
    try {
      await api("/api/presets", { password: pw, action: "list" });  // 비밀번호 검증 겸 목록 조회
      password = pw;
      sessionStorage.setItem("qr_admin_pw", pw);
      $("lock").hidden = true;
      $("editor").hidden = false;
      await loadLive();
      setMsg($("lockMsg"), "");
    } catch (e) {
      setMsg($("lockMsg"), e.message, "error");
    } finally {
      $("unlockBtn").disabled = false;
    }
  }

  $("unlockBtn").addEventListener("click", unlock);
  $("password").addEventListener("keydown", (e) => { if (e.key === "Enter") unlock(); });

  $("addBtn").addEventListener("click", () => { addEntry(); refreshDirty(); });
  $("resetBtn").addEventListener("click", () => {
    renderEntries(toEntries(live));
    renderDays(live.active_days);
    refreshDirty();
    toast("되돌렸습니다");
  });

  $("saveBtn").addEventListener("click", async () => {
    const schedule = collect();
    for (const e of schedule) {
      if (!TIME_RE.test(e.time)) { toast("시각을 모두 입력하세요", true); return; }
      if (!e.qr_image) { toast(e.time + " 의 QR 이미지를 넣어주세요", true); return; }
      if (e.after_close_url && !/^https?:\/\//.test(e.after_close_url)) {
        toast(e.time + " 의 링크는 http(s)로 시작해야 합니다", true); return;
      }
    }
    const times = schedule.map((e) => e.time);
    const dupe = times.find((t, i) => times.indexOf(t) !== i);
    if (dupe) { toast("같은 시각이 두 번 있습니다: " + dupe, true); return; }
    if (!getDays().length) { toast("실행 요일을 최소 하나 선택하세요", true); return; }

    $("saveBtn").disabled = true;
    try {
      await api("/api/update", { password, schedule, active_days: getDays() });
      await loadLive();
      toast("저장했습니다 · 학생 PC에 1분 내 반영");
    } catch (e) {
      toast(e.message, true);
    } finally {
      $("saveBtn").disabled = false;
    }
  });

  // ---------- 프리셋 ----------
  function renderPresetOptions() {
    const sel = $("presetSelect");
    sel.innerHTML = "";
    const ids = Object.keys(presetsCache);
    const ph = document.createElement("option");
    ph.value = "";
    ph.textContent = ids.length ? "불러올 설정 선택..." : "(저장된 설정 없음)";
    sel.appendChild(ph);
    ids.forEach((id) => {
      const o = document.createElement("option");
      o.value = id;
      o.textContent = presetsCache[id].name;
      sel.appendChild(o);
    });
  }

  async function refreshPresets() {
    try {
      const data = await api("/api/presets", { password, action: "list" });
      presetsCache = data.presets || {};
      renderPresetOptions();
    } catch (e) {
      setMsg($("presetMsg"), e.message, "error");
    }
  }

  $("presetsPanel").addEventListener("toggle", () => {
    if ($("presetsPanel").open) refreshPresets();
  });

  $("presetSelect").addEventListener("change", () => {
    const p = presetsCache[$("presetSelect").value];
    if (!p) return;
    renderEntries(toEntries(p));
    renderDays(p.active_days);
    refreshDirty();
    toast('"' + p.name + '" 을 불러왔습니다 · 저장해야 반영됩니다');
  });

  $("presetSaveBtn").addEventListener("click", async () => {
    const name = $("presetName").value.trim();
    if (!name) { setMsg($("presetMsg"), "이름을 입력하세요.", "error"); return; }
    const schedule = collect();
    if (schedule.some((e) => !e.time || !e.qr_image)) {
      setMsg($("presetMsg"), "시각과 QR 이미지를 먼저 채워주세요.", "error");
      return;
    }
    try {
      await api("/api/presets", { password, action: "save", name, schedule, active_days: getDays() });
      $("presetName").value = "";
      setMsg($("presetMsg"), "");
      await refreshPresets();
      toast('"' + name + '" 으로 저장했습니다');
    } catch (e) {
      setMsg($("presetMsg"), e.message, "error");
    }
  });

  $("presetRenameBtn").addEventListener("click", async () => {
    const id = $("presetSelect").value;
    if (!presetsCache[id]) { setMsg($("presetMsg"), "설정을 선택하세요.", "error"); return; }
    const name = prompt("새 이름", presetsCache[id].name);
    if (!name || !name.trim()) return;
    try {
      await api("/api/presets", { password, action: "rename", id, name: name.trim() });
      await refreshPresets();
      toast("이름을 바꿨습니다");
    } catch (e) { setMsg($("presetMsg"), e.message, "error"); }
  });

  $("presetDeleteBtn").addEventListener("click", async () => {
    const id = $("presetSelect").value;
    if (!presetsCache[id]) { setMsg($("presetMsg"), "설정을 선택하세요.", "error"); return; }
    if (!confirm('"' + presetsCache[id].name + '" 을 삭제할까요?')) return;
    try {
      await api("/api/presets", { password, action: "delete", id });
      await refreshPresets();
      toast("삭제했습니다");
    } catch (e) { setMsg($("presetMsg"), e.message, "error"); }
  });

  // ---------- 비밀번호 변경 ----------
  $("changePwBtn").addEventListener("click", async () => {
    const a = $("newPw").value.trim(), b = $("newPw2").value.trim();
    if (a.length < 6) { setMsg($("pwMsg"), "6자 이상이어야 합니다.", "error"); return; }
    if (a !== b) { setMsg($("pwMsg"), "확인이 일치하지 않습니다.", "error"); return; }
    try {
      await api("/api/change-password", { current_password: password, new_password: a });
      password = a;
      sessionStorage.setItem("qr_admin_pw", a);
      $("newPw").value = ""; $("newPw2").value = "";
      setMsg($("pwMsg"), "");
      toast("비밀번호를 변경했습니다");
    } catch (e) { setMsg($("pwMsg"), e.message, "error"); }
  });

  // 같은 탭에서 새로고침해도 다시 입력하지 않도록
  (function restore() {
    const saved = sessionStorage.getItem("qr_admin_pw");
    if (!saved) return;
    $("password").value = saved;
    unlock();
  })();
</script>
</body>
</html>
