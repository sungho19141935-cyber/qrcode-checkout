<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>퇴실 QR 관리자</title>
<style>
  :root { color-scheme: light dark; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    max-width: 480px;
    margin: 60px auto;
    padding: 0 20px;
    color: #1f2328;
    background: #fff;
  }
  @media (prefers-color-scheme: dark) {
    body { color: #e6edf3; background: #0d1117; }
    input { background: #161b22; color: #e6edf3; border-color: #30363d; }
    .card { background: #161b22; border-color: #30363d; }
  }
  h1 { font-size: 1.4rem; margin-bottom: 4px; }
  p.sub { color: #656d76; margin-top: 0; font-size: 0.9rem; }
  .card {
    border: 1px solid #d0d7de;
    border-radius: 10px;
    padding: 20px;
    margin-top: 20px;
  }
  label { display: block; font-size: 0.85rem; font-weight: 600; margin: 14px 0 4px; }
  input {
    width: 100%;
    box-sizing: border-box;
    padding: 8px 10px;
    border: 1px solid #d0d7de;
    border-radius: 6px;
    font-size: 0.95rem;
  }
  button {
    margin-top: 18px;
    width: 100%;
    padding: 10px;
    border: none;
    border-radius: 6px;
    background: #1f883d;
    color: white;
    font-weight: 600;
    font-size: 0.95rem;
    cursor: pointer;
  }
  button.secondary { background: #57606a; margin-top: 8px; }
  button:disabled { opacity: 0.6; cursor: not-allowed; }
  .msg { margin-top: 14px; font-size: 0.88rem; white-space: pre-wrap; }
  .msg.error { color: #cf222e; }
  .msg.ok { color: #1a7f37; }
  .hint { color: #656d76; font-size: 0.8rem; margin-top: 20px; }
  .days { display: flex; gap: 6px; }
  .days label {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    font-weight: 400;
    font-size: 0.8rem;
    margin: 0;
    border: 1px solid #d0d7de;
    border-radius: 6px;
    padding: 8px 0;
    cursor: pointer;
  }
  @media (prefers-color-scheme: dark) {
    .days label { border-color: #30363d; }
  }
  .days input { width: auto; margin: 0; }
</style>
</head>
<body>
  <h1>퇴실 QR 관리자</h1>
  <p class="sub">비밀번호로 로그인 후 QR URL과 퇴실 시각을 갱신하세요.</p>

  <div class="card">
    <label for="password">관리자 비밀번호</label>
    <input id="password" type="password" autocomplete="current-password" />

    <label for="qrFile">퇴실 QR 이미지 (스크린샷/이미지 파일)</label>
    <input id="qrFile" type="file" accept="image/*" />
    <img id="preview" alt="QR 미리보기" style="display:none; max-width:100%; margin-top:10px; border:1px solid #d0d7de; border-radius:6px;" />

    <label for="time">퇴실 시각 (HH:MM)</label>
    <input id="time" type="text" placeholder="18:00" />

    <label>실행 요일</label>
    <div class="days">
      <label><input type="checkbox" value="mon" checked />월</label>
      <label><input type="checkbox" value="tue" checked />화</label>
      <label><input type="checkbox" value="wed" checked />수</label>
      <label><input type="checkbox" value="thu" checked />목</label>
      <label><input type="checkbox" value="fri" checked />금</label>
      <label><input type="checkbox" value="sat" />토</label>
      <label><input type="checkbox" value="sun" />일</label>
    </div>

    <button id="loadBtn" class="secondary" type="button">현재 값 불러오기</button>
    <button id="saveBtn" type="button">저장</button>

    <div id="msg" class="msg"></div>
  </div>

  <p class="hint">저장하면 학생 프로그램은 몇 분 내로 자동으로 새 QR을 받아갑니다.</p>

<script>
  const msgEl = document.getElementById("msg");
  const passwordEl = document.getElementById("password");
  const fileEl = document.getElementById("qrFile");
  const previewEl = document.getElementById("preview");
  const timeEl = document.getElementById("time");
  const dayEls = Array.from(document.querySelectorAll(".days input"));
  const loadBtn = document.getElementById("loadBtn");
  const saveBtn = document.getElementById("saveBtn");

  const DEFAULT_DAYS = ["mon", "tue", "wed", "thu", "fri"];

  let qrImageDataUrl = null; // 새로 고른 파일이 있으면 이 값을 저장에 사용

  function setActiveDays(days) {
    const set = new Set(days && days.length ? days : DEFAULT_DAYS);
    dayEls.forEach((el) => { el.checked = set.has(el.value); });
  }

  function getActiveDays() {
    return dayEls.filter((el) => el.checked).map((el) => el.value);
  }

  function showMsg(text, type) {
    msgEl.textContent = text;
    msgEl.className = "msg" + (type ? " " + type : "");
  }

  function readFileAsDataUrl(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = () => reject(reader.error);
      reader.readAsDataURL(file);
    });
  }

  fileEl.addEventListener("change", async () => {
    const file = fileEl.files[0];
    if (!file) return;
    qrImageDataUrl = await readFileAsDataUrl(file);
    previewEl.src = qrImageDataUrl;
    previewEl.style.display = "block";
  });

  loadBtn.addEventListener("click", async () => {
    loadBtn.disabled = true;
    showMsg("불러오는 중...");
    try {
      const r = await fetch("/api/current");
      const data = await r.json();
      if (!r.ok) throw new Error(data.error || "불러오기 실패");
      timeEl.value = data.checkout_time || "";
      setActiveDays(data.active_days);
      if (data.qr_image) {
        previewEl.src = data.qr_image;
        previewEl.style.display = "block";
        qrImageDataUrl = data.qr_image; // 새 파일을 안 고르면 이 기존 이미지 그대로 저장됨
      }
      showMsg("현재 값을 불러왔습니다.", "ok");
    } catch (e) {
      showMsg("오류: " + e.message, "error");
    } finally {
      loadBtn.disabled = false;
    }
  });

  saveBtn.addEventListener("click", async () => {
    const password = passwordEl.value.trim();
    const checkout_time = timeEl.value.trim();
    const active_days = getActiveDays();

    if (!password || !checkout_time) {
      showMsg("비밀번호와 시각을 입력하세요.", "error");
      return;
    }
    if (!qrImageDataUrl) {
      showMsg("QR 이미지를 선택하거나, 먼저 '현재 값 불러오기'로 기존 이미지를 불러오세요.", "error");
      return;
    }
    if (active_days.length === 0) {
      showMsg("실행 요일을 최소 하나는 선택하세요.", "error");
      return;
    }

    saveBtn.disabled = true;
    showMsg("저장 중...");
    try {
      const r = await fetch("/api/update", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ password, checkout_time, qr_image: qrImageDataUrl, active_days }),
      });
      const data = await r.json();
      if (!r.ok) throw new Error(data.error || "저장 실패");
      showMsg("저장 완료! 학생 PC에는 곧 자동으로 반영됩니다.", "ok");
    } catch (e) {
      showMsg("오류: " + e.message, "error");
    } finally {
      saveBtn.disabled = false;
    }
  });
</script>
</body>
</html>
